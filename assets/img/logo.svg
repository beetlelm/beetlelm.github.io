<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="beetle">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a7bf0"/>
      <stop offset="0.55" stop-color="#6d5ae0"/>
      <stop offset="1" stop-color="#4a3bb0"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eae6ff"/>
    </linearGradient>
  </defs>

  <!-- rounded badge -->
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#badge)"/>
  <rect x="2" y="2" width="60" height="60" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.2"/>

  <!-- beetle -->
  <g stroke="url(#shell)" stroke-width="2.6" stroke-linecap="round" fill="none">
    <!-- antennae -->
    <path d="M28 16 C24 11 21 10 18.5 8.5"/>
    <path d="M36 16 C40 11 43 10 45.5 8.5"/>
    <!-- legs (left) -->
    <path d="M19 29 L9.5 25"/>
    <path d="M18 38 L7.5 38"/>
    <path d="M19 47 L9.5 51.5"/>
    <!-- legs (right) -->
    <path d="M45 29 L54.5 25"/>
    <path d="M46 38 L56.5 38"/>
    <path d="M45 47 L54.5 51.5"/>
  </g>

  <!-- head -->
  <ellipse cx="32" cy="18" rx="5.6" ry="4.4" fill="url(#shell)"/>
  <!-- body / elytra -->
  <ellipse cx="32" cy="38" rx="14" ry="17" fill="url(#shell)"/>
  <!-- centre seam -->
  <path d="M32 23 L32 53" stroke="#6d5ae0" stroke-width="2.4" stroke-linecap="round"/>
  <!-- wing spots -->
  <circle cx="25.5" cy="33" r="2.1" fill="#6d5ae0"/>
  <circle cx="38.5" cy="33" r="2.1" fill="#6d5ae0"/>
  <circle cx="25.5" cy="44" r="2.1" fill="#8a7bf0"/>
  <circle cx="38.5" cy="44" r="2.1" fill="#8a7bf0"/>
</svg>
